<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-800 text-white flex justify-center items-center ">
    
   <div class="main mt-[200px]">
<h1 class="text-4xl font-bold  text-center mb-5">Todo List</h1>

<form action="">

    <input type="text" id="input" placeholder="Enter Any Task....." class=" p-3 bg-slate-500 rounded-l-full">
    <button type="button" class="bg-slate-950 rounded-r-full p-3" onclick="add()"> Add</button>
</form>

<div class="list bg-slate-400 mt-5 p-5 rounded-xl ">
    <table class="w-full">
        <thead class="bg-slate-900 rounded w-full">
        <th class="text-start p-3 ">Details</th>
        <th class="text-start p-3 ">Actions</th>        
        </thead>
        <tbody id="list">
           
        </tbody>
    </table>
</div>

   </div>

<script src="app.js"></script>
</body>
</html>
